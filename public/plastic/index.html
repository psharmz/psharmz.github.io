  <style>
    /* ════════════════════════════════════════════════════════
       PLASTICS IN GROCERY STORES
       Placeholder page. The surface is a self-healing cutting
       mat, drawn rather than photographed so it stays crisp at
       any size, and the packaging cutouts frame the copy like
       pieces laid out on the mat waiting to be cut apart.
       NB: Bootstrap 3 sets html{font-size:10px} here, so every
       size is px — rem would render half-size.
       ════════════════════════════════════════════════════════ */

    /* ── The mat ──────────────────────────────────────────────
       Fixed, so the page reads as copy resting ON the mat
       rather than a texture scrolling behind it. */
    .pl-mat {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #1B6A56;
      background-image:
        /* 1/2" majors */
        repeating-linear-gradient(to right,  rgba(255,255,255,0.20) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.20) 0 1px, transparent 1px 72px),
        /* 1/8" minors */
        repeating-linear-gradient(to right,  rgba(255,255,255,0.075) 0 1px, transparent 1px 18px),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.075) 0 1px, transparent 1px 18px),
        /* the slight mottling a self-healing mat has under raking light */
        radial-gradient(ellipse at 22% 18%, rgba(255,255,255,0.05), transparent 55%),
        radial-gradient(ellipse at 78% 72%, rgba(0,0,0,0.20), transparent 60%);
      background-position: 12px 12px, 12px 12px, 12px 12px, 12px 12px, 0 0, 0 0;
    }

    /* Ruler bands down the top and left edges, exactly like the printed mat:
       a hairline every 1/8", a taller one every 1/2". */
    .pl-mat::before,
    .pl-mat::after {
      content: "";
      position: absolute;
      background-repeat: repeat;
    }

    .pl-mat::before {
      top: 0; left: 0; right: 0; height: 26px;
      background-color: rgba(0, 0, 0, 0.22);
      background-image:
        repeating-linear-gradient(to right, rgba(255,255,255,0.85) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(to right, rgba(255,255,255,0.45) 0 1px, transparent 1px 18px);
      background-size: 100% 100%, 100% 55%;
      background-position: 12px bottom, 12px bottom;
      background-repeat: repeat-x;
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    }

    .pl-mat::after {
      top: 0; left: 0; bottom: 0; width: 26px;
      background-color: rgba(0, 0, 0, 0.22);
      background-image:
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.85) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.45) 0 1px, transparent 1px 18px);
      background-size: 100% 100%, 55% 100%;
      background-position: right 12px, right 12px;
      background-repeat: repeat-y;
      border-right: 1px solid rgba(255, 255, 255, 0.35);
    }

    /* The 30/45/60/90 guides. An SVG rather than more gradients, because these
       need to meet at one origin the way they do on the real mat. */
    .pl-guides {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    .pl-guides line { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1.2; }
    .pl-guides text {
      fill: rgba(255, 255, 255, 0.55);
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    /* Darkened edge so the mat reads as an object with a rubber lip. */
    .pl-vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.42);
    }

    /* ── Content ──────────────────────────────────────────────
       Above the mat, on its own plate so the grid never fights
       the copy. */
    .pl-page .page-content {
      position: relative;
      z-index: 2;
    }

    .pl-hero {
      min-height: 62vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 720px;
    }

    .pl-plate {
      padding: clamp(26px, 4vw, 48px);
      border-radius: 18px;
      background: rgba(8, 26, 21, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(3px);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.35);
    }

    .pl-note {
      margin: 26px 0 0;
      font-family: var(--font-body);
      font-size: 15px;
      line-height: var(--leading-body);
      color: rgba(255, 255, 255, 0.62);
    }

    .pl-back {
      display: inline-block;
      margin-top: 24px;
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: var(--weight-semibold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-text-teal);
      text-decoration: none;
    }

    .pl-back:hover,
    .pl-back:focus-visible {
      color: var(--color-text-teal);
      text-decoration: underline;
    }

    /* ── The framing pieces ───────────────────────────────────
       Laid along both edges rather than falling: the packaging
       frames the page like offcuts arranged on the mat. */

    /* The stage is what gives the page its height and what the pieces are
       positioned against, so the frame can overlay the copy from the very top
       instead of starting below it. Clipping here is what stops the pieces
       that hang off each edge from widening the document. */
    .pl-stage {
      position: relative;
      min-height: 165vh;
      overflow: hidden;
    }

    .pl-frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .pl-piece {
      position: absolute;
      /* --side is the horizontal anchor, --y the position down the page. */
      top: var(--y);
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    .pl-piece--left  { left: var(--side, -3vw); transform: translateX(-90px) rotate(var(--rot, -6deg)); }
    .pl-piece--right { right: var(--side, -3vw); transform: translateX(90px)  rotate(var(--rot, 6deg)); }

    /* Set by the observer once a piece scrolls into view. */
    .pl-piece.is-in {
      opacity: 1;
      transform: translateX(0) rotate(var(--rot, 0deg));
    }

    /* The pulse lives on the inner img so it can breathe without fighting the
       slide-in transform on the wrapper. */
    .pl-piece img {
      display: block;
      width: var(--w, 190px);
      height: auto;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.45));
      animation: pl-pulse var(--pulse, 6s) ease-in-out var(--pulse-delay, 0s) infinite;
      will-change: transform;
    }

    /* Deliberately small: at more than a few percent it reads as a heartbeat
       rather than something settling on a surface. */
    @keyframes pl-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.035); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pl-piece {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .pl-piece--left, .pl-piece--right { transform: none; }
      .pl-piece img { animation: none; }
    }

    @media (max-width: 820px) {
      .pl-piece img { width: calc(var(--w, 190px) * 0.6); }
      .pl-stage { min-height: 180vh; }
      .pl-hero { min-height: 54vh; }
    }
  </style>
</head>

  <body class="fs-page pl-page embossed-nav">

    <!-- Nav + brand mark are injected by js/nav-component.js -->

    <!-- The mat. Decorative, so it stays out of the accessibility tree. -->
    <div class="pl-mat" aria-hidden="true"></div>
    <svg class="pl-guides" aria-hidden="true" preserveAspectRatio="none"
         viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
      <!-- All guides radiate from the lower-left origin, as on the real mat. -->
      <line x1="40" y1="660" x2="1000" y2="106"/>   <!-- 30° -->
      <line x1="40" y1="660" x2="700"  y2="0"/>     <!-- 45° -->
      <line x1="40" y1="660" x2="420"  y2="0"/>     <!-- 60° -->
      <line x1="360" y1="0"  x2="1000" y2="640"/>   <!-- crossing guide -->
      <text x="330" y="560">30&#176;</text>
      <text x="250" y="420">45&#176;</text>
      <text x="185" y="300">60&#176;</text>
      <text x="470" y="255">90&#176;</text>
    </svg>
    <div class="pl-vignette" aria-hidden="true"></div>

    <div class="pl-stage">

    <div class="page-content">
      <div class="fs-wrap">

        <header class="fs-head pl-hero">
          <div class="pl-plate">
            <p class="fs-eyebrow">RegenIntel Fellowship</p>
            <h1 class="fs-title">Plastics in Grocery Stores</h1>
            <p class="fs-intro">
              Research on what plastic does to our bodies and to the environment,

            </p>
            <p class="pl-note">

            </p>
            <a class="pl-back" href="/regenintel.html">&larr; Back to the fellowship</a>
          </div>
        </header>

      </div><!-- /.fs-wrap -->
    </div><!-- /.page-content -->

    <!-- Framing: packaging laid along both edges, revealed on the way down.
         Decorative, so hidden from assistive tech. -->
    <div class="pl-frame" aria-hidden="true">
      <div class="pl-piece pl-piece--left"  style="--y: 3vh;  --side: -4vw; --w: 200px; --rot: -7deg; --pulse: 6.5s; --pulse-delay: 0s;">
        <img src="/img/plastic/strawberries.png" alt="">
      </div>
      <div class="pl-piece pl-piece--right" style="--y: 13vh; --side: -3vw; --w: 175px; --rot: 8deg;  --pulse: 7.5s; --pulse-delay: -1.2s;">
        <img src="/img/plastic/tomatoes-red.png" alt="">
      </div>
      <div class="pl-piece pl-piece--left"  style="--y: 38vh; --side: -2vw; --w: 165px; --rot: 5deg;  --pulse: 5.5s; --pulse-delay: -2.4s;">
        <img src="/img/plastic/tomatoes-yellow.png" alt="">
      </div>
      <div class="pl-piece pl-piece--right" style="--y: 50vh; --side: -5vw; --w: 195px; --rot: -6deg; --pulse: 8s;   --pulse-delay: -0.6s;">
        <img src="/img/plastic/tomatoes-pack.png" alt="">
      </div>
      <div class="pl-piece pl-piece--left"  style="--y: 76vh; --side: -4vw; --w: 180px; --rot: -4deg; --pulse: 7s;   --pulse-delay: -3s;">
        <img src="/img/plastic/tomatoes-red.png" alt="">
      </div>
      <div class="pl-piece pl-piece--right" style="--y: 88vh; --side: -2vw; --w: 205px; --rot: 7deg; --pulse: 6s;   --pulse-delay: -1.8s;">
        <img src="/img/plastic/strawberries.png" alt="">
      </div>
      <div class="pl-piece pl-piece--left"  style="--y: 110vh; --side: -3vw; --w: 160px; --rot: 6deg; --pulse: 7.2s; --pulse-delay: -4s;">
        <img src="/img/plastic/tomatoes-pack.png" alt="">
      </div>
      <div class="pl-piece pl-piece--right" style="--y: 121vh; --side: -4vw; --w: 170px; --rot: -8deg; --pulse: 6.8s; --pulse-delay: -2.1s;">
        <img src="/img/plastic/tomatoes-yellow.png" alt="">
      </div>
      <div class="pl-piece pl-piece--left"  style="--y: 138vh; --side: -2vw; --w: 185px; --rot: -5deg; --pulse: 7.8s; --pulse-delay: -0.9s;">
        <img src="/img/plastic/strawberries.png" alt="">
      </div>
      <div class="pl-piece pl-piece--right" style="--y: 146vh; --side: -3vw; --w: 165px; --rot: 5deg;  --pulse: 6.3s; --pulse-delay: -3.3s;">
        <img src="/img/plastic/tomatoes-red.png" alt="">
      </div>
    </div>

    </div><!-- /.pl-stage -->

    <script src="/js/nav-component.js"></script>
    <script src="/js/project.js"></script>

    <script>
      // Reveal each piece as it enters the viewport, then stop watching it.
      // Falls back to simply showing everything where IntersectionObserver
      // isn't available, so the frame is never left invisible.
      (function () {
        var pieces = [].slice.call(document.querySelectorAll('.pl-piece'));
        if (!pieces.length) return;

        if (!('IntersectionObserver' in window)) {
          pieces.forEach(function (p) { p.classList.add('is-in'); });
          return;
        }

        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            e.target.classList.add('is-in');
            io.unobserve(e.target);
          });
        }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });

        pieces.forEach(function (p) { io.observe(p); });
      })();
    </script>
