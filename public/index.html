  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="author" content="">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />

  <!-- Link-preview card (iMessage, Slack, LinkedIn, Gmail, etc. read these) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Parul Sharma">
  <meta property="og:title" content="Parul Sharma — Product Designer">
  <meta property="og:description" content="Portfolio and case studies: enterprise, healthcare, AI and platform design.">
  <meta property="og:url" content="https://psharmz.github.io/">
  <meta property="og:image" content="https://psharmz.github.io/img/parul-avatar.jpg">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <!-- Self-hosted Instrument Serif + DM Sans. Linked here rather than @import-ed from
       src/index.css so the browser can start fetching them from the initial HTML
       instead of waiting for the bundled stylesheet to parse first. -->
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/pill-nav.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <!-- The two faces that render above the fold: fetch them in parallel with the
       CSS rather than after it. -->
  <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-serif-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Embossed label-maker face (Impact Label by Tension Type — freeware,
       web embedding permitted; license ships in /fonts/misc/). Declared here
       so the browser loads it from /fonts/ rather than the webpack bundle. -->
  <style>
    @font-face {
      font-family: 'Impact Label';
      src: url('/fonts/ImpactLabel-lVYZ.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/javascript">
    // GitHub Pages hack to handle client-side routing
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  <script src="/js/button-shimmer.js" defer></script>
  <script src="/js/analytics.js" async></script>
</body>
</html>
