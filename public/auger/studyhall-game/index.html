s empezando a salir de ello. Sigue así","Your freedom is a direct result of just and inclusive relationships with others":"Tu libertad es el resultado directo de relaciones justas e inclusivas con las demás personas",Share:"Compartir","Interested in becoming a facilitator?":"¿Te interesa ser facilitador(a)?","First step:":"Primer paso:","complete the game in Study Mode.":"completa el juego en Modo Estudio.","Start Study Mode":"Comenzar Modo Estudio","Your vision for the future":"Tu visión para el futuro","Play Again":"Jugar de nuevo",Support:"Apoyar","Support Study Hall":"Apoya Study Hall","If you would like to support Study Hall financially or otherwise, please reach out to":"Si deseas apoyar a Study Hall económicamente o de otra forma, escríbenos a","Share your result":"Comparte tu resultado",Copy:"Copiar",Copied:"Copiado",Email:"Correo",Message:"Mensaje",YOU:"TÚ",AVG:"PROM.","Your score":"Tu puntaje","Avg. score of all participants":"Puntaje promedio de todas las personas participantes","Spider chart of scores by theme":"Gráfico de araña con los puntajes por tema","Suggestions for Taking Action":"Sugerencias para Actuar",Scenarios:"Escenarios","Scenarios in this quadrant":"Escenarios de este cuadrante","This card has not been written yet.":"Esta tarjeta aún no ha sido escrita.","Your answer":"Tu respuesta","You ran out of time without choosing.":"Se te acabó el tiempo sin elegir una respuesta.","You did not play this scenario.":"No jugaste este escenario.",Why:"Por qué","Fully aligned answer":"Respuesta totalmente alineada","The scenario":"El escenario","Low score":"Puntaje bajo","Medium score":"Puntaje medio","High score":"Puntaje alto","What others think about environmental justice in technology":"Lo que otras personas piensan sobre la justicia ambiental en la tecnología","Filter word cloud by country":"Filtrar la nube de palabras por país","Not enough data":"No hay datos suficientes","What players picked on the goals screen.":"Lo que las personas jugadoras eligieron en la pantalla de metas.","Designing with Power and Positionality in Mind":"Diseñar con el Poder y la Posicionalidad en Mente","Embedding Access, Accountability,":"Incorporar el Acceso, la Rendición de Cuentas","and Reparative Practice":"y la Práctica Reparadora","Restructuring Innovation for":"Reestructurar la Innovación para","Collective Flourishing":"el Florecimiento Colectivo","Reorienting the Relationship Between Technology and Nature":"Reorientar la Relación entre la Tecnología y la Naturaleza","Learning with others":"Aprender con otras personas","Mapping the systems":"Mapear los sistemas","Helping others":"Ayudar a otras personas","Look around you. What technologies do people around you use daily and which ones are not accessible to them? Who made these technologies? Do you know how they serve your community and how they serve those that built it? Whose interests are really at the center of the development and usage of these tools? Here you can also map assumptions, observations and understandings about race, colonialism, and power as they relate to the history of the people that use and build the tools.":"Mira a tu alrededor. ¿Qué tecnologías usan a diario las personas que te rodean y cuáles no están a su alcance? ¿Quiénes hicieron estas tecnologías? ¿Sabes cómo sirven a tu comunidad y cómo sirven a quienes las construyeron? ¿Los intereses de quiénes están realmente en el centro del desarrollo y el uso de estas herramientas? Aquí también puedes mapear supuestos, observaciones y entendimientos sobre la raza, el colonialismo y el poder, en relación con la historia de las personas que usan y construyen estas herramientas.","Have you ever considered applying your knowledge to build a table comparing community-owned/open source and mainstream/commercial alternatives to the tech used by you and those in your community? How do they compare beyond available features and aesthetics? For example, are there power asymmetries that can further reinforce the position of those with already a lot of power? How do these asymmetries are embedded in the tech lifecycle from early development to usage, and disposal or composting? How these asymmetries are reinforced or hindered by the interaction between the different technologies in your community?":"¿Has pensado alguna vez en aplicar tus conocimientos para armar una tabla que compare alternativas comunitarias o de código abierto con alternativas comerciales o convencionales a la tecnología que usas tú y las personas de tu comunidad? ¿Cómo se comparan más allá de las funciones disponibles y la estética? Por ejemplo, ¿hay asimetrías de poder que pueden reforzar aún más la posición de quienes ya tienen mucho poder? ¿Cómo están incorporadas estas asimetrías en el ciclo de vida de la tecnología, desde su desarrollo inicial hasta su uso y su desecho o compostaje? ¿Cómo se refuerzan o se frenan estas asimetrías por la interacción entre las distintas tecnologías de tu comunidad?","Your critical perspective is valuable! Have you ever considered using your knowledge to draft a public policy proposal or design process that can support power distribution and how technical decisions can be rejected by communities in cases of disagreement? Think about how you can use that to guide all stakeholders, but specially the most vulnerable ones, to move beyond consultation and into actual decision-making power for acceptance, development, modification, and stoppage.":"¡Tu perspectiva crítica es valiosa! ¿Has pensado alguna vez en usar tus conocimientos para redactar una propuesta de política pública o un proceso de diseño que apoye la distribución del poder y la posibilidad de que las comunidades rechacen decisiones técnicas cuando no estén de acuerdo? Piensa en cómo puedes usarlo para guiar a todas las partes interesadas, pero especialmente a las más vulnerables, para ir más allá de la consulta y llegar a un verdadero poder de decisión sobre la aceptación, el desarrollo, la modificación y la detención de la tecnología.","Look around you. What technologies do people around you use daily and which ones are not accessible to them? Talk to people and ask if they understand the trade offs of the technologies that are accessible to them - for example, do free tools require collection of personal information? Start a simple map with the information you gather from others and try to understand how their life story relates to how they use, understand, talk about technology.":"Mira a tu alrededor. ¿Qué tecnologías usan a diario las personas que te rodean y cuáles no están a su alcance? Habla con las personas y pregúntales si entienden las ventajas y desventajas de las tecnologías a las que sí tienen acceso; por ejemplo, ¿las herramientas gratuitas requieren recopilar información personal? Empieza un mapa sencillo con la información que reúnas de otras personas e intenta entender cómo su historia de vida se relaciona con la forma en que usan, entienden y hablan de la tecnología.","Have you ever considered using the knowledge you have to a create comparative table of relevant technologies to your community? You can help moving towards a more just future with technology by comparing aspects such as documentations access, repairability, modification rights, who benefits, who might be harmed (humans and non-humans) and how harms can be handle if they happen. You can also take a step further and look at such aspects of comparison within the lifecycle of the technology to understand more about the impact of its creation (e.g., resource extraction), usage (including in its interaction with other technologies), and disposal.":"¿Has pensado alguna vez en usar lo que sabes para crear una tabla comparativa de las tecnologías relevantes para tu comunidad? Puedes ayudar a avanzar hacia un futuro más justo con la tecnología comparando aspectos como el acceso a la documentación, la posibilidad de reparación, los derechos de modificación, quién se beneficia, a quién se podría perjudicar (seres humanos y no humanos) y cómo se pueden manejar los daños si ocurren. También puedes ir un paso más allá y mirar esos aspectos a lo largo del ciclo de vida de la tecnología para entender mejor el impacto de su creación (p. ej., la extracción de recursos), su uso (incluida su interacción con otras tecnologías) y su desecho.","You seem to have some strong understanding on the topic! Have you ever considered using your knowledge to draft a public policy proposal or a designing a process to measure and enable equitable accessibility, accountability (including reparation from harms), and safety (preventive and reactive)? Finally, how can you draft these documents through a participatory process with others from your community?":"¡Parece que entiendes muy bien el tema! ¿Has pensado alguna vez en usar tus conocimientos para redactar una propuesta de política pública o diseñar un proceso que mida y haga posible la accesibilidad equitativa, la rendición de cuentas (incluida la reparación de daños) y la seguridad (preventiva y reactiva)? Y por último, ¿cómo puedes redactar estos documentos mediante un proceso participativo con otras personas de tu comunidad?","Have you taken some time to notice the examples of innovation around you? Which ones often appear in the news, workplaces, and other environments that are part of your reality and that of your community? What makes those technologies innovative? Who defines what is innovative? What types of knowledge are centered and which ones are ignored in these technologies? What is their main impact and purpose - speed, novelty, capital and wealth? Historically, have they enable collective flourishing or individual competition?":"¿Te has tomado un tiempo para fijarte en los ejemplos de innovación que te rodean? ¿Cuáles aparecen con frecuencia en las noticias, los lugares de trabajo y otros entornos que forman parte de tu realidad y la de tu comunidad? ¿Qué hace innovadoras a esas tecnologías? ¿Quién define lo que es innovador? ¿Qué tipos de conocimiento se ponen en el centro y cuáles se ignoran en estas tecnologías? ¿Cuál es su principal impacto y propósito: la velocidad, la novedad, el capital y la riqueza? Históricamente, ¿han hecho posible el florecimiento colectivo o la competencia individual?","Have you consider using your knowledge to compare venture-capital/market-driven innovations with community-led/mutual aid innovation? What forms of legal structures are present in each? What incentives and barriers facilitate or difficult their development? Which of them has historically shown a relative higher rate of harms and unintended consequences? How do market-driven innovations interact within themselves? What about community-led innovations? Finally, how do market-driven and community-led innovations interact with each other - do they collaborate or compete? Who often loses? Why?":"¿Has pensado en usar tus conocimientos para comparar las innovaciones impulsadas por el capital de riesgo y el mercado con las innovaciones lideradas por la comunidad y basadas en la ayuda mutua? ¿Qué formas de estructura legal hay en cada una? ¿Qué incentivos y barreras facilitan o dificultan su desarrollo? ¿Cuál de ellas ha mostrado históricamente una tasa relativamente mayor de daños y consecuencias no deseadas? ¿Cómo interactúan entre sí las innovaciones impulsadas por el mercado? ¿Y las lideradas por la comunidad? Por último, ¿cómo interactúan entre sí las innovaciones impulsadas por el mercado y las lideradas por la comunidad: colaboran o compiten? ¿Quién suele perder? ¿Por qué?","Your critical perspective can help others! Have you ever considered using your knowledge to draft a public policy proposal or innovation process centered in collective well-being instead of speed and individual wealth accumulation? What methods and criteria can be used as indicators of shared benefit, distributed decision-making power, plurality of knowledge and participation? What criteria can be used to build a systems of incentive that reinforce this collective well-being? How can community reviews, participatory budgeting, harm prevention plan, reparation plans, and public and transparent document of harms and learnings can lead to a more just innovation process?":"¡Tu perspectiva crítica puede ayudar a otras personas! ¿Has pensado alguna vez en usar tus conocimientos para redactar una propuesta de política pública o un proceso de innovación centrado en el bienestar colectivo en lugar de la velocidad y la acumulación individual de riqueza? ¿Qué métodos y criterios se pueden usar como indicadores de beneficio compartido, poder de decisión distribuido, pluralidad de conocimientos y participación? ¿Qué criterios se pueden usar para construir un sistema de incentivos que refuerce este bienestar colectivo? ¿Cómo pueden las revisiones comunitarias, los presupuestos participativos, los planes de prevención de daños, los planes de reparación y un registro público y transparente de daños y aprendizajes llevar a un proceso de innovación más justo?","Take some time to notice the type of technology most used in your community. What materials are used in this technology? Where do these materials come from? What type of energy (e.g., hydro, coal, gas, solar, wind...) supplies these technologies and your community? How is the infrastructure that supports these technologies exploit versus care about nature? How do people in your community talk about and relate to non-human life? What practices do they have that show alignment or dealignment with the technologies used? How has technology historically influenced the changes in these practices of relationship with nature in your community?":"Tómate un tiempo para fijarte en el tipo de tecnología que más se usa en tu comunidad. ¿Qué materiales se usan en esta tecnología? ¿De dónde vienen esos materiales? ¿Qué tipo de energía (p. ej., hidráulica, carbón, gas, solar, eólica...) alimenta estas tecnologías y a tu comunidad? ¿En qué medida la infraestructura que sostiene estas tecnologías explota o cuida la naturaleza? ¿Cómo hablan las personas de tu comunidad de la vida no humana y cómo se relacionan con ella? ¿Qué prácticas tienen que muestren una alineación o una desalineación con las tecnologías usadas? ¿Cómo ha influido históricamente la tecnología en los cambios de estas prácticas de relación con la naturaleza en tu comunidad?","Have you consider using your knowledge to compare the extractive technologies with regenerative alternatives? How do they relate and learn from nature? How do they support people's relationship with other forms of life and their supporting environment? What forms of energy they use? What are their ecosystem impacts, who bears the harms, and how restoration responds to the harms cause by each of them? Finally, can you map these aspects in each stage of the technology lifecycle and in their interactions with other technologies that are involved in the creation, usage, and disposal of restorative versus regenerative tech?":"¿Has pensado en usar tus conocimientos para comparar las tecnologías extractivas con alternativas regenerativas? ¿Cómo se relacionan con la naturaleza y aprenden de ella? ¿Cómo apoyan la relación de las personas con otras formas de vida y con el entorno que las sostiene? ¿Qué formas de energía usan? ¿Cuáles son sus impactos en los ecosistemas, quién carga con los daños y cómo responde la restauración a los daños causados por cada una? Por último, ¿puedes mapear estos aspectos en cada etapa del ciclo de vida de la tecnología y en sus interacciones con otras tecnologías involucradas en la creación, el uso y el desecho de tecnología restaurativa frente a la regenerativa?","Your knowledge can support a more just future! Consider writing a public policy draft or a design process that supports technologies that restore instead of exploit life on Earth. How should work relationship be set in such a restorative perspective? What is the value of life beyond its transformation into products and materials? What indicators of regeneration, local ecological limits, and harm should be considered? How can the participation of peoples with different forms of knowledge, such as indigenous peoples and traditional communities, be essential in such a transformation? How may historical harms be taken into account, linking technology development to restoration and reconciliation funds and actions? Embed lessons into the document to model scientific, ecological, and political humility and accountability.":"¡Tu conocimiento puede apoyar un futuro más justo! Considera escribir un borrador de política pública o un proceso de diseño que apoye tecnologías que restauran la vida en la Tierra en lugar de explotarla. ¿Cómo deberían establecerse las relaciones de trabajo desde esa perspectiva restaurativa? ¿Cuál es el valor de la vida más allá de su transformación en productos y materiales? ¿Qué indicadores de regeneración, límites ecológicos locales y daño habría que considerar? ¿Cómo puede ser esencial, en una transformación así, la participación de pueblos con otras formas de conocimiento, como los pueblos indígenas y las comunidades tradicionales? ¿Cómo pueden tenerse en cuenta los daños históricos, vinculando el desarrollo tecnológico con fondos y acciones de restauración y reconciliación? Incorpora aprendizajes en el documento para modelar humildad y responsabilidad científicas, ecológicas y políticas."},t4={wordsSelected_one:"{{count}} word selected.",wordsSelected_other:"{{count}} words selected.",selectedLetter:"Selected {{letter}}",submitLetter:"Submit {{letter}}",scenarioTitle:"Scenario {{n}}: {{title}}",scenarioN:"Scenario {{n}}",scoreRange:"{{name}} {{from}} to {{to}}",everyone:"Everyone: {{avg}}/{{max}}",wordCloudLabel:"Word cloud of what players picked, for {{scope}}",shareSubject:"{{game}} — I got {{label}}",playLink:"Play: {{url}}"};He.use(M3).init({resources:{en:{translation:t4},es:{translation:e4}},lng:"en",fallbackLng:"en",keySeparator:!1,nsS erests are really at the center of the development and usage of these tools? Here you can also map assumptions, observations and understandings about race, colonialism, and power as they relate to the history of the people that use and build the tools."},{label:"Mapping the systems",text:"Have you ever considered applying your knowledge to build a table comparing community-owned/open source and mainstream/commercial alternatives to the tech used by you and those in your community? How do they compare beyond available features and aesthetics? For example, are there power asymmetries that can further reinforce the position of those with already a lot of power? How do these asymmetries are embedded in the tech lifecycle from early development to usage, and disposal or composting? How these asymmetries are reinforced or hindered by the interaction between the different technologies in your community?"},{label:"Helping others",text:"Your critical perspective is valuable! Have you ever considered using your knowledge to draft a public policy proposal or design process that can support power distribution and how technical decisions can be rejected by communities in cases of disagreement? Think about how you can use that to guide all stakeholders, but specially the most vulnerable ones, to move beyond consultation and into actual decision-making power for acceptance, development, modification, and stoppage."}]},{slug:"access_accountability",title:["Embedding Access, Accountability,","and Reparative Practice"],suggestions:[{label:"Learning with others",text:"Look around you. What technologies do people around you use daily and which ones are not accessible to them? Talk to people and ask if they understand the trade offs of the technologies that are accessible to them - for example, do free tools require collection of personal information? Start a simple map with the information you gather from others and try to understand how their life story relates to how they use, understand, talk about technology."},{label:"Mapping the systems",text:"Have you ever considered using the knowledge you have to a create comparative table of relevant technologies to your community? You can help moving towards a more just future with technology by comparing aspects such as documentations access, repairability, modification rights, who benefits, who might be harmed (humans and non-humans) and how harms can be handle if they happen. You can also take a step further and look at such aspects of comparison within the lifecycle of the technology to understand more about the impact of its creation (e.g., resource extraction), usage (including in its interaction with other technologies), and disposal."},{label:"Helping others",text:"You seem to have some strong understanding on the topic! Have you ever considered using your knowledge to draft a public policy proposal or a designing a process to measure and enable equitable accessibility, accountability (including reparation from harms), and safety (preventive and reactive)? Finally, how can you draft these documents through a participatory process with others from your community?"}]},{slug:"collective_flourishing",title:["Restructuring Innovation for","Collective Flourishing"],suggestions:[{label:"Learning with others",text:"Have you taken some time to notice the examples of innovation around you? Which ones often appear in the news, workplaces, and other environments that are part of your reality and that of your community? What makes those technologies innovative? Who defines what is innovative? What types of knowledge are centered and which ones are ignored in these technologies? What is their main impact and purpose - speed, novelty, capital and wealth? Historically, have they enable collective flourishing or individual competition?"},{label:"Mapping the systems",text:"Have you consider using your knowledge to compare venture-capital/market-driven innovations with community-led/mutual aid innovation? What forms of legal structures are present in each? What incentives and barriers facilitate or difficult their development? Which of them has historically shown a relative higher rate of harms and unintended consequences? How do market-driven innovations interact within themselves? What about community-led innovations? Finally, how do market-driven and community-led innovations interact with each other - do they collaborate or compete? Who often loses? Why?"},{label:"Helping others",text:"Your critical perspective can help others! Have you ever considered using your knowledge to draft a public policy proposal or innovation process centered in collective well-being instead of speed and individual wealth accumulation? What methods and criteria can be used as indicators of shared benefit, distributed decision-making power, plurality of knowledge and participation? What criteria can be used to build a systems of incentive that reinforce this collective well-being? How can community reviews, participatory budgeting, harm prevention plan, reparation plans, and public and transparent document of harms and learnings can lead to a more just innovation process?"}]},{slug:"technology_nature",title:["Reorienting the Relationship Between Technology and Nature"],suggestions:[{label:"Learning with others",text:"Take some time to notice the type of technology most used in your community. What materials are used in this technology? Where do these materials come from? What type of energy (e.g., hydro, coal, gas, solar, wind...) supplies these technologies and your community? How is the infrastructure that supports these technologies exploit versus care about nature? How do people in your community talk about and relate to non-human life? What practices do they have that show alignment or dealignment with the technologies used? How has technology historically influenced the changes in these practices of relationship with nature in your community?"},{label:"Mapping the systems",text:"Have you consider using your knowledge to compare the extractive technologies with regenerative alternatives? How do they relate and learn from nature? How do they support people's relationship with other forms of life and their supporting environment? What forms of energy they use? What are their ecosystem impacts, who bears the harms, and how restoration responds to the harms cause by each of them? Finally, can you map these aspects in each stage of the technology lifecycle and in their interactions with other technologies that are involved in the creation, usage, and disposal of restorative versus regenerative tech?"},{label:"Helping others",text:"Your knowledge can support a more just future! Consider writing a public policy draft or a design process that supports technologies that restore instead of exploit life on Earth. How should work relationship be set in such a restorative perspective? What is the value of life beyond its transformation into products and materials? What indicators of regeneration, local ecological limits, and harm should be considered? How can the participation of peoples with different forms of knowledge, such as indigenous peoples and traditional communities, be essential in such a transformation? How may historical harms be taken into account, linking technology development to restoration and reconciliation funds and actions? Embed lessons into the document to model scientific, ecological, and political humility and accountability."}]}];function f4(t){return[1,Math.floor(t/2),t]}const Jh=p4.map(t=>{const e=h4[t.slug],n=e.length*ss.full,i=f4(n);return{...t,scenarios:e,max:n,min:e.length*ss.non,suggestions:t.suggestions.map((r,s)=>({...r,max:i[s]}))}}),g4=!1,d2=[{key:"you",name:"Your score",stroke:"#A9E9E4",fill:"rgba(124, 186, 186, 0.42)"},{key:"avg",name:"Avg. score of all participants",stroke:"#A97BF0",fill:"rgba(139, 90, 214, 0.32)"}],m4=Object.fromEntries(d2.map(t=>[t.key,t])),Xu=400,Zu=300,v4=760,y4=600,x4=380,w4=280,Nn=148,ed=4,Is=.5,Gs="
