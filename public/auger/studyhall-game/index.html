les son importantes, pero no aseguran relaciones sinérgicas con los ecosistemas vivos ni con las comunidades.","Minimizar el impacto es bueno, pero no crea las relaciones positivas y colaborativas que exige la justicia ambiental.","La justicia ambiental ve la tecnología como parte de la red de relaciones naturales y sistemas vivos, no como algo separado de ella."]},{principle:"La tecnología ambientalmente justa no se usa para excluir partes de la Tierra para el uso de algunas personas y no de otras. Permite que todas las personas accedan a todas las partes de la Tierra.",advisors:["Luchar por la democracia es entender que rara vez, o nunca, la gente llegará a un consenso. A veces podemos crear formas que no necesiten tocar estos conflictos. Otras veces sí necesitamos tomar decisiones difíciles para proteger los recursos valiosos que determinan la prosperidad y la soberanía de nuestra nación.","La idea de que los humanos no son parte de la naturaleza es la base de muchos proyectos y políticas dañinas impulsados por organizaciones ecologistas y conservacionistas. Decir que la actividad humana causa los problemas ambientales es repartir por igual la responsabilidad de los daños entre todas las culturas, que por cierto es lo único que la élite sabe repartir. Pero no todas las culturas de este mundo son iguales. No todos ven el mundo de la misma manera.","Este mundo está lleno de críticos y no hay nada que hagas que no sea condenado, incluidos tus intentos de hacer el bien. Solo asegúrate de jugar dentro de los límites difusos del sistema y, si decides salir de tu zona de confort, asegúrate de que la recompensa realmente valga el riesgo."],explanations:["Aunque la protección de los ecosistemas es importante, este enfoque podría continuar los patrones de restricción del acceso de las personas a la tierra.","La justicia ambiental se opone a usar la tecnología para excluir a las personas de partes de la Tierra y busca, en cambio, un acceso equitativo.","Los sistemas legales actuales suelen reflejar estructuras coloniales y de propiedad privada que pueden excluir a las personas del acceso a la tierra.","La postura neutral es un mito y solo refuerza el statu quo. Por lo tanto, si el statu quo ya es destructivo, la supuesta postura neutral también lo será.","Un mayor acceso es positivo, pero esto no aborda las preguntas fundamentales sobre quién controla las decisiones de acceso."]},{principle:"La tecnología ambientalmente justa es de código abierto. La tecnología ambientalmente justa pone toda la información sobre su creación (incluidos planos, instrucciones o manuales e información para su reparación) a disposición y al alcance de todos, libremente, para empoderar a todas las personas a fabricar, reparar, modificar y desarrollar su tecnología.",advisors:["Desafortunadamente, no existe el almuerzo gratis para todos. Algunas personas tendrán que pagar para que otras accedan a ciertos beneficios. Esta es la belleza de vivir en una sociedad libre que entiende el valor de nuestros emprendedores, porque es a través de su liderazgo que podemos usar el capital para el bien.","Todo lo que hacemos tiene un impacto tanto destructivo como constructivo. Así que aquí hay una regla simple para una sociedad mejor: si realmente crees que lo que creaste ayuda más de lo que perjudica a la creación de una sociedad más justa y equitativa, entonces ponlo a disposición y al alcance de todos. Pero recuerda que solo puedes compartir lo que es tuyo.","La tecnología completamente de código abierto solo ocurre cuando la tecnología es horrible o inútil, o cuando es un pequeño truco de marketing para que la gente compre tu producto principal. Mantén bajo tu control lo que es valioso para que puedas decidir cómo se usa y quién lo usa."],explanations:["Los principios de código abierto aseguran que todas las personas puedan fabricar, reparar, modificar y desarrollar tecnología para el máximo beneficio colectivo.","Las restricciones propietarias impiden el acceso igualitario al desarrollo y a la reparación de la tecnología, limitando la innovación.","Aunque es interesante como modelo, este enfoque aún restringe el acceso y no se alinea con los principios de acceso universal de la justicia ambiental.","Las preocupaciones de seguridad suelen usarse para justificar restricciones que mantienen los desequilibrios de poder en lugar de proteger realmente a las personas.","Aunque esto muestra aprecio por las primeras comunidades usuarias, limita el acceso de otros grupos en situaciones similares."]},{principle:"La justicia ambiental en la tecnología requiere que las cargas y los beneficios de la tecnología se compartan por igual entre todas las personas. La tecnología ambientalmente justa nunca empoderará a un grupo a expensas de otro.",advisors:["No todas las consecuencias pueden preverse, ni siquiera por los científicos más inteligentes. Por eso necesitamos encontrar formas de abordar y minimizar los daños que ocurrirán. Además, debemos empezar a ver nuestros desafíos como oportunidades de crecimiento.",'Todos sabemos que hasta hoy algunas personas todavía se creen superiores a otras y, por lo tanto, creen que los espacios que habitan también deberían reflejar esa superioridad. Todo esto suele hacerse explotando tanto los espacios como las vidas consideradas "inferiores". Pero, a estas alturas, no hay lugar en este mundo que no haya sido explotado. Así que, o esos aspirantes a dioses abandonan para siempre este planeta en sus naves espaciales, o se quedan aquí y aprenden a compartir.',"Mira, cuando la gente habla del efecto goteo lo que dice es que algunos lugares y personas son simplemente más eficientes que otros para impulsar el progreso. Claro, no necesitas concentrar toda la energía en esos lugares y personas; puedes trasladar una parte a otros. Pero, en general, así es como se hacen las cosas."],explanations:["La compensación reconoce el problema, pero no aborda la inequidad fundamental de la distribución desigual de las cargas.","La justicia ambiental exige que tanto los beneficios como las cargas de la tecnología se distribuyan por igual entre todas las comunidades.",'Los argumentos del "bien común" suelen perpetuar la injusticia ambiental al ignorar a quienes cargan con los costos del progreso.',"Este enfoque traslada las cargas a menos personas en lugar de abordar la inequidad fundamental de la distribución de las cargas.","Un mercado mal distribuido como contexto habilita y refuerza la dinámica de explotación que contribuyó a crear las desigualdades o las creó, donde quienes tienen dinero se benefician más."]},{principle:"La justicia ambiental en la tecnología se esfuerza por eliminar las cargas globales y locales inherentes a su creación.",advisors:['La ganancia nunca fue el problema. El verdadero problema es la ganancia sucia. Es hora de invertir en lo que yo llamo "ganancia limpia", que solo se logra adaptando la actividad industrial a mejores regulaciones ambientales y tecnologías sostenibles.',"Cada mejora a este sistema que no pretenda crear un cambio estructural no es más que un paso más pequeño hacia el colapso planetario. Desacelerar con tecnología o políticas solo nos dará tiempo adicional, pero no resuelve los problemas fundamentales que nos trajeron a esta crisis.","El progreso a menudo exige sacrificios, pero el progreso también crea formas de reducir esos sacrificios sin bloquear un mayor progreso."],explanations:["Estas mejoras reducen el daño, pero no eliminan la carga fundamental de la producción extractiva sobre las comunidades.","Esto traslada las cargas ambientales y sociales en lugar de eliminarlas, continuando los patrones extractivos.","La verdadera justicia ambiental requiere cambios sistémicos y estructurales en cómo creamos tecnología, no solo mejoras a los sistemas existentes.","Esto puede proteger a algunos trabajadores, pero también puede sustituir por completo a los humanos e incluso aumentar los costos ambientales y sociales más amplios de la extracción al aumentar la eficiencia.","Las regulaciones más estrictas pueden limitar el daño, pero no eliminan las cargas fundamentales de los sistemas de producción extractivos."]},{principle:"La justicia ambiental en la tecnología exige desplegar la tecnología donde y cuando sea apropiada y beneficiosa para su comunidad local. Cuando no se cumplen estos criterios, la tecnología ambientalmente justa no se despliega.",advisors:["Es cierto que algunos lugares y grupos son más vulnerables, pero hay momentos en que lo mejor es ayudar a quienes pueden facilitar aún más el cambio, aunque no estén en posiciones de vulnerabilidad. Igual que en los aviones, cuando la persona adulta debe ponerse primero la mascarilla de oxígeno antes de ayudar a un niño o a una persona mayor.","Cuando vas a la casa de alguien, lo respetuoso es primero saber si eres bienvenido allí. Si es así, entonces puedes hablar con quienes viven en la casa sobre detalles específicos como la hora, la fecha y lo que quieren que lleves. Esta regla simple se aplica bien prácticamente en todas partes.","La idea es simple: ve adonde está la energía. Es decir, busca no solo los lugares donde la demanda de tu producto es alta, sino también donde las inversiones de capital son bajas. Cuanto mayor sea tu retorno de inversión, mejor podrás hacer cosas extra de tu elección, como ayudar a otras personas en necesidad."],explanations:["El despliegue guiado por las ganancias suele ignorar las necesidades de la comunidad y puede agravar las desigualdades existentes.","Los estudios de mercado no necesariamente reflejan lo que es más beneficioso para las comunidades o para la justicia ambiental.","La justicia ambiental prioriza el beneficio y la pertinencia para la comunidad local por encima de las consideraciones de mercado o del potencial de ganancias.","Los enfoques utilitaristas pueden pasar por alto a las comunidades minoritarias y a los contextos locales específicos que importan para la justicia.","Este enfoque puede perpetuar las desigualdades existentes en infraestructura y acceso tecnológico entre comunidades."]},{principle:"La justicia ambiental en la tecnología contempla la limpieza y la restauración de las tierras, las aguas y las comunidades que han sido dañadas por usos pasados de la tecnología.",advisors:["Hay una dura verdad que a pocos les gusta oír: uno solo puede hacer hasta cierto punto para remediar daños pasados. Averigua cuánto puedes hacer y ofrece lo que puedas. Ir más allá de tus posibilidades es exponerte a que malos actores exploten tus vulnerabilidades.","En una disculpa adecuada no solo dices que lo sientes y por qué lo sientes; también necesitas reconocer el daño que causaste y las acciones que tomarás para remediarlo y evitar que el comportamiento se repita. Finalmente, necesitas invitar la retroalimentación de la persona dañada. Eso es un trabajo difícil porque es un trabajo maduro y exige abrirse a la creación de confianza.","Los errores pasan. No lo pienses demasiado. Aprende de tus errores y sigue adelante."],explanations:["Ignorar los daños pasados perpetúa la injusticia ambiental y no atiende el sufrimiento continuo de las comunidades afectadas.","La justicia ambiental requiere reparar activamente el daño causado por decisiones tecnológicas pasadas, no solo prevenir daños futuros.","El apoyo financiero es útil, pero no cumple con toda la responsabilidad de la empresa en la restauración directa y la sanación de las comunidades.","Reconocer es importante para la rendición de cuentas, pero es insuficiente sin acciones concretas de restauración y reparación comunitaria.","Las políticas de prevención son cruciales, pero no atienden la urgente necesidad de reparar el daño existente y sanar a las comunidades afectadas."]},{principle:"La justicia ambiental en la tecnología exige eliminar las intenciones coloniales y neocoloniales con la tecnología; en cambio, fomenta la autodeterminación, la libertad y la repatriación.",advisors:["Todas las personas tienen derecho a sus opiniones y siempre debemos esforzarnos por escuchar cuantas voces podamos. Estas voces pueden ser las semillas de soluciones alternativas que se desarrollen más y lleven al florecimiento económico de toda una nación.","A veces, lo más difícil en el proceso de descolonizarse a uno mismo y a una cultura no es tomar conciencia de los daños de la forma de vida colonial, sino superar los miedos incrustados en ella para empezar a sentir y comportarse de manera diferente.","A menudo, la crítica es solo la consecuencia de un argumento mal entendido. Facilita la comprensión para crear acuerdo."],explanations:["La justicia ambiental exige desmantelar activamente las estructuras coloniales y apoyar la soberanía indígena y el control comunitario.","La representación ayuda, pero no aborda las estructuras coloniales sistémicas incrustadas en cómo opera el desarrollo tecnológico.","Esto puede perpetuar relaciones coloniales al imponer paradigmas tecnológicos externos en lugar de respetar el conocimiento de la comunidad.","Las alianzas pueden ser valiosas, pero no necesariamente transfieren poder real ni abordan las estructuras coloniales de fondo en la toma de decisiones.","Aprender del conocimiento tradicional puede ser valioso, pero puede ser extractivo si no se hace con el debido respeto, reciprocidad y control comunitario."]},{principle:"La tecnología ambientalmente justa no está separada de la naturaleza, la Tierra y el medio ambiente. Por el contrario, funciona de forma sinérgica con la naturaleza.",advisors:["El camino hacia un futuro mejor está lleno de conflictos. A veces, en lugar de desafiar a tu enemigo, es mucho mejor ignorarlo o simplemente alejarte de la fuente del conflicto.","Hay muchas palabras elegantes que se usan hoy para representar una verdad simple pero poderosa que nuestras comunidades conocen desde hace mucho: los humanos somos parte de la naturaleza. Sin embargo, las formas en que interactuamos con otras formas de vida también pueden ser muy distintas de un lugar a otro. Y, aunque pueda haber lineamientos generales que nos ayuden, no existe un conjunto fijo y específico de reglas universales para establecer esta relación. Esto debe entenderse y protegerse.","Sé metódico con tu estrategia. Las buenas intenciones pueden llevar a la gente a tomar riesgos innecesarios con muy poco retorno real."],explanations:["No se debe juzgar a las comunidades por los conflictos armados regionales, y la separación continúa la división dañina entre tecnología y naturaleza que está en la base de muchos problemas ambientales y sociales.","Evitar trampas conservadoras puede ser útil, pero centrarse solo en la biomímesis no necesariamente crea las relaciones verdaderamente sinérgicas con los sistemas vivos que las comunidades necesitan.","La justicia ambiental ve la tecnología como parte de la red de relaciones naturales y de la vida comunitaria, no como algo separado de ella.","Jugar con la ambigüedad es arriesgado y puede apoyar el statu quo. Minimizar el impacto es bueno, pero no crea las relaciones positivas y colaborativas con la naturaleza que las comunidades imaginan.","Los materiales sostenibles son importantes, pero no aseguran las relaciones sinérgicas con los ecosistemas vivos y la vida comunitaria."]},{principle:"La tecnología ambientalmente justa es intencional respecto al daño. Es consciente de a quién ayuda y a quién perjudica una tecnología determinada.",advisors:["Los grupos locales no deberían preocuparse por problemas globales, abstracciones y generalizaciones. Concéntrate en lo que tienes justo enfrente. Dales apoyo para empezar y una educación relevante para sus problemas locales. Deja que los expertos se ocupen de la perspectiva más amplia.",'Piensa global, actúa local. La batalla puede estar en tu patio trasero, pero está ocurriendo en todas partes. Así que recuerda: las herramientas siempre se construyen para servir un propósito que se alinea con una forma de ser en este mundo y que es reforzado por los sistemas de incentivos y castigos vigentes. Toda herramienta puede usarse de distintas maneras y tener múltiples propósitos, muchos de los cuales pueden permanecer ocultos hasta que se ha desarrollado lo suficiente para mostrar su cara "verdadera". Por eso es importante avanzar con cuidado.',"¿La gente está preocupada? Pues déjala expresar sus preocupaciones. Se sentirá mejor después. Luego promueve las preocupaciones que se alineen con tu estrategia e ignora el resto. De todos modos, no puedes hacerlo todo."],explanations:["Las evaluaciones de impacto son importantes, pero no aseguran una atención activa y continua a quién se beneficia y a quién se perjudica con el tiempo.","La capacitación crea conciencia, pero no asegura una atención sistemática al daño ni un apoyo real a lo largo de todos los procesos de desarrollo y despliegue.","Los comités de expertos pueden ayudar, pero no aseguran una intencionalidad cotidiana respecto al daño en las operaciones reales y las relaciones con las comunidades (incluso pueden reproducir patrones coloniales).","Los estándares ofrecen una guía mínima, pero no aseguran una atención activa y continua a quién es ayudado y quién es perjudicado en cada contexto.","La intencionalidad respecto al daño requiere vigilancia y acción continuas, no solo una evaluación inicial o revisiones periódicas."]},{principle:"La justicia ambiental en la tecnología exige que la democracia sea el fundamento de todas sus iniciativas. Un entorno democrático y centrado en la comunidad es necesario para tener un mundo justo.",advisors:["Hay momentos en que la estandarización es necesaria para superar la abrumadora complejidad de gestionar múltiples perspectivas. Pero la estandarización en sí debe hacerse mediante una colaboración real con la multitud de visiones con las que estás tratando.","La verdadera rendición de cuentas es el resultado de la capacidad de tomar decisiones junto con la oportunidad de aprender y adaptarse a las consecuencias de esas decisiones.","La vida humana es corta y, por eso, nuestras decisiones deben ser rápidas. Es ingenuo pensar que la colaboración a gran escala puede ser eficiente. Claro, a veces aporta ideas interesantes, pero simplemente es demasiado lenta. Así que escucha a los demás, pero si eso está tomando demasiado tiempo, sé un líder y decide tú."],explanations:["Las asambleas globales son valiosas, pero no necesariamente dan a cada comunidad un poder real de decisión sobre la tecnología que las afecta.","La verdadera tecnología democrática requiere que las comunidades tengan autoridad real sobre su futuro tecnológico, no solo oportunidades de opinar.","Aunque el debate es importante, las estructuras consultivas a menudo carecen de poder real e incluso pueden usarse para legitimar decisiones tomadas en otra parte de la red.","Los roles consultivos carecen de poder real de decisión y las asociaciones público-privadas suelen priorizar la eficiencia y los intereses externos sobre las necesidades genuinas y la autodeterminación de las comunidades.","La representación en una junta central puede dar cierta influencia, pero no asegura el control comunitario sobre las decisiones tecnológicas locales."]},{principle:"La justicia ambiental en la tecnología exige eliminar las intenciones coloniales y neocoloniales con la tecnología; en cambio, fomenta la autodeterminación, la libertad y la repatriación.",advisors:["No todo se puede abordar con marcos simples. Hay momentos en que las decisiones exigirán un enfoque más complejo para lidiar con la complejidad de múltiples voces.","El problema de adoptar el enfoque colaborativo centrado en la comunidad es que es un camino que te aleja del control centralizado. Pero solo se puede dejar atrás el control centralizado cuando se superan los traumas y miedos creados por la cultura colonial.","Manejar datos privados es muy delicado y a veces es mejor crear una capa que te distancie de cualquier riesgo potencial al tratar con los datos. Pero los riesgos también traen oportunidades, algunas de las cuales pueden ayudar al desarrollo social y científico."],explanations:["El control cooperativo es mejor que el control corporativo, pero solo asegura la soberanía de la comunidad sobre su propia información si la comunidad se ve representada por la cooperativa.","Aunque las regulaciones y leyes de protección de datos son importantes, la supervisión gubernamental no asegura la autodeterminación de la comunidad sobre sus datos.","La soberanía de los datos significa que las comunidades controlan su propia información, lo que apoya la autodeterminación y previene la explotación por entidades externas.","Los custodios externos pueden ser preferibles al control corporativo y gubernamental, pero a menos que estén representados directa y mayoritariamente por miembros de la comunidad, aun así no dan a las comunidades soberanía directa sobre su información.","Los enfoques de múltiples partes interesadas pueden incluir las voces de la comunidad, pero pueden diluir el control comunitario sobre su propia información y sus vidas."]}],a3=["El presente no es perfecto, pero estoy seguro de que ahora sabes cómo hacerlo un poco mejor.","Estamos contigo en esto y orgullosos de todo lo que has aprendido y de lo que aún aprenderás. El futuro que elijas determinará las relaciones que tengas con todas las personas y con todo lo que te rodea.","El único futuro que puedes imaginar es tu propio futuro."],Gu=[{titleLines:["Día 1 en","Techflow"],paragraphs:['Es tu primer día en TechFlow, una empresa emergente prometedora que desarrolla soluciones de IA. Durante la orientación, te enteras de que la empresa está trabajando en un sistema de contratación con IA para grandes corporaciones. Tu nueva gerente, Sarah, te aparta para poner a prueba tu pensamiento crítico: "Necesitamos perspectivas frescas en este proyecto. La IA de contratación ha estado marcando ciertos currículums de manera menos favorable, y no estamos seguros de por qué. ¿Cómo crees que deberíamos abordarlo?"'],options:["Sugerir centrarse en eliminar los sesgos de los conjuntos de datos y algoritmos existentes.","Recomendar basar el rediseño en principios antirracistas desde la raíz e involucrar a las comunidades afectadas.",'Proponer hacer que la IA sea completamente "daltónica" eliminando todos los indicadores demográficos.',"Recomendar implementar sistemas de cuotas para garantizar resultados de contratación equitativos.","Sugerir entrenar a la IA con datos de las empresas más exitosas de la industria."]},{titleLines:["DESAFÍO DE","INNOVACIÓN"],paragraphs:[`Han pasado unos meses y tu gerente te invita a unirte a un equipo especial de 'Sprint de Innovación'. "Estamos bajo presión del CEO y los inversores para mejorar nuestra imagen de marca. Necesitamos lanzar al menos un producto innovador este trimestre que pueda ayudar a las comunidades marginadas", explica. "La velocidad lo es todo en este mercado, ya que hay poca inversión". Cuando el equipo se reúne por primera vez, la sala se llena de entusiasmo sobre prototipos rápidos y lanzamientos acelerados. ¿Cómo guías el enfoque de innovación del equipo?`],options:["Adoptar la cultura de ritmo rápido y centrarse en la iteración rápida para mantenerse competitivo.","Recomendar seguir las mejores prácticas establecidas en la industria y garantizar el cumplimiento normativo.","Proponer formar diferentes comités de revisión para evaluar los productos antes del lanzamiento.","Sugerir realizar una investigación de mercado exhaustiva y pruebas de usuario antes de cualquier lanzamiento.","Abogar por proporcionar recursos para que todos innoven, considerar las posibles consecuencias no deseadas y centrar la empatía en cada decisión."]},{titleLines:["VISITA A LA","COMUNIDAD"],paragraphs:[`Tu enfoque de innovación ha ganado respeto dentro de TechFlow. La empresa decide que es hora de que te incorpores a un proyecto real desde el principio y la plataforma 'Aldeas Digitales' para comunidades rurales e indígenas parece ser la adecuada. Has sido elegido para liderar la participación comunitaria en un posible sitio piloto: una pequeña comunidad indígena en Montana. Durante tu visita, te reúnes con los ancianos de la comunidad, que escuchan cortésmente tu presentación, pero entonces la anciana Mary interviene: "Agradecemos que hayas venido, pero nuestra gente ha vivido bien durante generaciones sin estas herramientas digitales. Preferimos mantener nuestras formas tradicionales". ¿Cómo respondes?`],options:["Presentar información más detallada sobre los beneficios de la plataforma para que puedan tomar una decisión totalmente informada.","Sugerir capacitación digital integral y gratuita, ofreciendo la plataforma TechFlow solo como una opción, para que puedan tomar una elección verdaderamente informada.","Ofrecer proporcionar solo servicios digitales básicos y esenciales, evitando funciones avanzadas.","Respetar completamente su elección y abogar dentro de TechFlow para proteger su derecho a vivir sin interferencia digital.","Explicar que la integración digital es inevitable en el mundo moderno y ofrecer apoyo para una transición gradual."]},{titleLines:["TRABAJANDO CON","EL GOBIERNO"],paragraphs:['Tu experiencia con la situación en Montana te brinda la oportunidad de trabajar con un equipo pequeño pero de alto impacto en Tecnología Ética. A los seis meses en tu nuevo rol, TechFlow recibe una oferta de contrato gubernamental lucrativa que podría ser la oportunidad que buscabas para demostrar la importancia de tu trabajo a escala nacional. Un representante del Departamento de Defensa te sorprende al explicar: "Necesitamos tecnología de vigilancia que pueda monitorear tanto áreas civiles por seguridad pública como zonas militares por seguridad nacional. Las capacidades de IA de su empresa son exactamente lo que necesitamos. Este contrato podría financiar sus proyectos de impacto social durante los próximos cinco años". La junta directiva está entusiasmada con el potencial de financiación e incluso te ha ofrecido el puesto de Director si logras esto. ¿Cuál es tu recomendación?'],options:["Aceptar el contrato, ya que las aplicaciones de seguridad civil superan las preocupaciones militares.","Negociar la aceptación sólo si las aplicaciones militares se limitan estrictamente a fines de defensa.","Rechazar todo el proyecto debido a la preocupación por la militarización/ conversión en arma de sistemas inteligentes y la vigilancia civil como habilitación de sistemas de opresión.","Aceptar el contrato si demuestra ayudar a prevenir daños y violencia mayores.","Proponer separar las aplicaciones civiles y militares, desarrollando solo los componentes de seguridad civil."]},{titleLines:["Asociación","con la Ciudad"],paragraphs:['El contrato militar demostró ser demasiado arriesgado y, finalmente, ganaste el apoyo de la junta directiva al presentar fuentes de ingresos alternativas. Ahora, TechFlow se asocia con la ciudad de Portland para desplegar infraestructura de ciudad inteligente. La oficina del alcalde quiere actuar con rapidez, pero algunos activistas se contactan contigo directamente: "Nos preocupa que se tomen decisiones sobre nuestros vecindarios sin una participación comunitaria real". Tu tarea es diseñar el proceso de participación comunitaria. ¿Qué propones?'],options:["Organizar encuestas comunitarias integrales, talleres y sesiones de retroalimentación para recopilar opiniones.","Establecer reuniones públicas periódicas donde los miembros de la comunidad puedan expresar sus preocupaciones y hacer preguntas.","Crear procesos de desarrollo transparentes con actualizaciones públicas regulares y sesiones informativas","Diseñar un sistema donde las comunidades afectadas estén informadas y tengan un poder real de decisión sobre las tecnologías que impactan sus vecindarios.","Formar juntas asesoras comunitarias con representantes de los vecindarios para guiar la implementación de todas las tecnologías y sistemas."]},{titleLines:["¡AVANZA RÁPIDO Y","ROMPE COSAS!"],paragraphs:['El enfoque centrado en la comunidad de Portland se convierte en un modelo que atrae atención nacional. Sin embargo, este éxito trae nuevos desafíos. Los inversores de TechFlow presionan para una rápida expansión y mayores márgenes de beneficio. "Necesitamos escalar rápidamente y maximizar los rendimientos", insiste el inversionista principal Jeff Muskenberg. "Todo este asunto de la participación comunitaria nos está frenando y reduciendo las ganancias". El CEO te pide que encuentres un término medio. ¿Cómo abogas por la dirección futura de TechFlow?'],options:["Explorar, a corto plazo, modelos centrados en el impacto más que en las ganancias, mientras se buscan formas de transitar desde modelos de inversión extractivos hacia la propiedad compartida y la distribución equitativa de ganancias con las comunidades.","Explorar estructuras alternativas como el estatus de Empresa B (B-Corp) para centrarse más en el impacto que en las ganancias.","Trabajar dentro del modelo de inversión actual para hacer que TechFlow sea lo más ética posible, cumpliendo con las expectativas de crecimiento sin cuestionarlas.","Presionar para implementar políticas internas más fuertes que restrinjan el comportamiento de maximización de ganancias.","Implementar métricas ESG (Ambientales, Sociales y de Gobernanza) y marcos de inversión de impacto para equilibrar las ganancias con el bien social."]},{titleLines:["CONSTRUYENDO:","¿A QUÉ COSTO?"],paragraphs:['Tus modelos económicos alternativos están ganando terreno, y TechFlow considera por primera vez una transición a una estructura diferente que incluya a las partes interesadas de la comunidad. Pero esta transición, si se produce, llevará tiempo. Mientras tanto, TechFlow enfrenta un rápido crecimiento en la demanda. El equipo técnico informa que los servidores actuales están a plena capacidad. "Necesitamos un centro de datos masivo", explica el Director de Tecnología, Marcus Rodríguez. "Estoy hablando de al menos 3GW con sistemas de refrigeración de vanguardia. Nos costará miles de millones, pero manejará nuestro crecimiento durante la próxima década más o menos sin necesidad de servidores de terceros". El equipo de ingeniería ha identificado tres ubicaciones potenciales, pero tu equipo está preocupado por el impacto que este mega centro de datos tendrá en las comunidades. ¿Cuál es tu recomendación?'],options:["Aprobar el centro de datos, pero asegurando que utilice 100% de energía renovable y los sistemas de refrigeración más eficientes.","Construir la instalación, pero compensar todos los impactos ambientales a través de programas verificados de créditos de carbono.","Cuestionar los supuestos, datos y proyecciones de un proyecto tan grande y el impacto que puede tener en las comunidades a lo largo del tiempo, mientras se proporcionan alternativas, como redes de servidores distribuidos y de propiedad comunitaria.","Aprobar una instalación subterránea para minimizar el impacto visual y la perturbación superficial del medio ambiente, asegurándose de que se construya en un lugar con abundancia de agua y energía.","Construir utilizando los más altos estándares de certificación ambiental y prácticas de construcción ecológica disponibles."]},{titleLines:["FILOSOFÍA DE","DISEÑO"],paragraphs:['Una corriente actual a favor de las infraestructuras distribuidas lleva a una innovadora red de "Community cloud"que se convierte en la oferta distintiva de TechFlow. Mientras diseñas la próxima generación de esta tecnología, te enfrentas a una pregunta fundamental sobre cómo debería relacionarse con el medio ambiente. El equipo de ingeniería presenta diferentes enfoques filosóficos. La arquitecta de software, la Dra. Sarah Kim, pregunta: "¿Cómo podría nuestra tecnología interactuar con el mundo natural?". ¿Qué filosofía debería guiar nuestra decisión?'],options:["Diseñar sistemas tecnológicos que permanezcan completamente separados de los entornos naturales para evitar interferencias en los ecosistemas.","Centrarse en la implementación avanzada de la biomímesis, diseñando sistemas que copien y aprendan de los procesos naturales de la manera más eficiente posible.","Construir toda la tecnología exclusivamente con materiales sostenibles, reciclables y renovables.","Priorizar el diseño de todos los sistemas para que tengan la menor huella ambiental posible.","Crear tecnología que funcione de forma sinérgica con los sistemas naturales, como parte de redes ecológicas integradas, siendo consciente de las trampas del sistema socioeconómico actual."]},{titleLines:["CONSERVACIÓN","COLONIAL"],paragraphs:['Tu filosofía de diseño sinérgico conduce a una novedosa tecnología de red que integra a las comunidades con los ecosistemas locales; el equipo la llama ´Red Viviente´. Sin embargo, surge una situación controversial: algunos grupos ambientalistas quieren utilizar la plataforma de TechFlow para crear "límites digitales" alrededor de áreas naturales sensibles, restringiendo el acceso humano para proteger los ecosistemas. Mientras tanto, defensores de los derechos indígenas argumentan que esto continúa los patrones coloniales de exclusión de la tierra. Te encuentras en medio de este debate en una acalorada reunión comunitaria. ¿Cómo manejas esta tensión?'],options:["Apoyar la postura de los grupos ambientalistas de que algunas áreas sensibles necesitan protección contra el acceso humano.","Abogar por el acceso a tecnología equitativa y sostenible para todos, mientras se apoya directamente a las comunidades indígenas y locales en su papel de guardianas de las áreas sensibles dentro de sus localidades.","Remitirse a los marcos legales existentes y a los derechos de propiedad para determinar las políticas de acceso apropiadas.","Adoptar una postura neutral para la tecnología de TechFlow, decidiendo continuar el proyecto tal como está  y sin tomar partido.","Diseñar tecnología que haga las áreas naturales remotas más accesibles para todas las personas, sin involucrarse en el tema de la gestión de los ecosistemas."]},{titleLines:["PATENTES Y LA","PRESIÓN POR","LOS INGRESOS"],paragraphs:['La tecnología de Red Viviente de TechFlow está atrayendo la atención de grandes corporaciones. La asesora legal, Janet Morrison, presenta dos caminos: "Podríamos patentar todo y licenciarlo para generar ingresos significativos, o..." Hace una pausa, conociendo tus principios. "...podríamos hacerlo completamente Open Source". El debate dentro de la empresa y entre los usuarios de la comunidad es intenso. Maria, trabajadora de TechFlow, aboga por las patentes: "Necesitamos ingresos para sostener nuestro trabajo y apoyar el progreso en nuestras carreras; de lo contrario, muchos se irán". El representante comunitario David Wakyoalla replica: "El conocimiento debe ser libre y si deciden ganar dinero con él, tiene que haber una distribución equitativa porque nosotros ayudamos a construir la tecnología". La decisión depende de tu recomendación. ¿Qué propones?'],options:["Publicar los detalles de la tecnología y liberarla completamente como código abierto: planos, código, manuales de reparación y procesos de desarrollo disponibles gratuitamente para todos.","Mantener algunos componentes centrales como propietarios para garantizar que las ganancias puedan redirigirse a las comunidades y así sostener su trabajo de desarrollo centrado en la comunidad.","Patentar la tecnología, pero permitir su uso gratuito para investigación, educación y proyectos de beneficio comunitario.","Hacer la tecnología de código abierto, pero mantener ciertos elementos críticos como propietarios por razones de seguridad.","Patentar la tecnología, pero permitir que las comunidades originales sigan usándola gratis."]},{titleLines:["Consecuencias","Inesperadas"],paragraphs:['Tu decisión de código abierto transforma a TechFlow en un movimiento global, con comunidades de todo el mundo adaptando tu tecnología de Red Viviente. Sin embargo, un patrón preocupante se vuelve explícito en los datos: las zonas urbanas que utilizan la tecnología están prosperando con nuevas oportunidades económicas y mejores servicios. Pero las regiones rurales que albergan los servidores de la red están siendo explotadas por inversionistas que se enteran de las vulnerabilidades de la comunidad, al mismo tiempo que experimentan un aumento en el consumo de energía y los residuos electrónicos. La defensora de la justicia ambiental, la Dra. Rosa Martínez, te confronta en una conferencia: "Tu tecnología está haciendo explícitos los problemas, pero también está reproduciendo los mismos patrones de explotación de siempre". ¿Cómo abordas esta crisis?'],options:["Prometer establecer un fondo económico para compensar a las comunidades rurales que mantienen la infraestructura de red de servidores.","Detener inmediatamente la expansión hasta que se pueda rediseñar el sistema para que los beneficios y las cargas se compartan por igual entre todas las comunidades, protegiendo a las más vulnerables de una mayor explotación.","Continuar con la expansión porque los beneficios urbanos sirven al bien común y eventualmente llegarán a las zonas rurales.","Reubicar la infraestructura de servidores en áreas menos pobladas para minimizar la cantidad de personas que experimentan impactos negativos.","Aprovechar la situación creando un mercado donde los problemas en ciudades y zonas rurales se presenten como oportunidades de inversión."]},{titleLines:["LA REVELACIÓN DE LA","CADENA DE","SUMINISTRO"],paragraphs:[`Mientras rediseñan para una distribución equitativa, la investigación de tu equipo revela una verdad perturbadora sobre la cadena de suministro de TechFlow. A pesar de sus intenciones éticas, la tecnología depende de minerales de tierras raras extraídos mediante minería ambientalmente destructiva en la República Democrática del Congo (RDC), lo que causa desplazamiento y problemas de salud para las comunidades locales. Kevin Chen, el gerente de la cadena de suministro, presenta la cruda realidad: "Casi toda la electrónica depende de estos materiales. Incluso nuestros competidores 'éticos' usan los mismos proveedores. Además, nuestra operación global está mucho mejor que la competencia. No estoy seguro de que este único aspecto sea tan preocupante". ¿Cómo respondes?`],options:["Cambiar a proveedores que utilicen energía renovable y mejoren la reducción de residuos en sus procesos de minería y fabricación.","Abogar por trasladar las operaciones mineras a áreas menos pobladas fuera de la RDC para minimizar el impacto humano directo.","Comprometerse a rediseñar fundamentalmente la tecnología y las cadenas de suministro para eliminar por completo los procesos extractivos y dañinos, incluyendo la inversión en investigación de materiales alternativos.","Aumentar la automatización en la minería y la fabricación para reducir la exposición humana directa a procesos peligrosos.","Abogar por cumplir y aplicar las normativas ambientales y laborales más estrictas disponibles en todas las operaciones."]},{titleLines:["DESPLIEGUE","GLOBAL"],paragraphs:["Tu compromiso para eliminar procesos de extracción dañinos lleva a un descubrimiento revolucionario: TechFlow desarrolla el primer proceso de manufactura de tecnología regenerativa usando materiales desarrollados con bioingeniería. Ahora, gobiernos y organizaciones de todo el mundo quieren desplegar tu sistema. Llegan solicitudes desde Silicon Valley, Lagos, Tokio, Mumbai y São Paulo. Cada ubicación ofrece ventajas diferentes: potencial de ganancias, infraestructura existente, apoyo político. Esta situación también te ha llevado a un nuevo rol con un equipo más grande: ¡felicidades, ahora eres Director de Despliegue Tecnológico Global y respondes directamente al CEO! Pero un gran poder conlleva grandes responsabilidades y riesgos. ¿Cómo decides dónde y cuándo expandirte?"],options:["Priorizar las ubicaciones donde el despliegue pueda generar las mayores ganancias para financiar una mayor expansión.","Utilizar estudios de mercado para identificar las regiones con mayor demanda y concentrar allí primero los esfuerzos.","Realizar investigación independiente y trabajar con socios locales potenciales para saber si, dónde y cuándo la tecnología es apropiada y beneficiosa para las comunidades locales antes de decidir expandirse.","Enfocar el despliegue en lugares donde la tecnología pueda tener el mayor impacto positivo en la mayor cantidad de personas.","Priorizar áreas donde ya existan infraestructura y recursos que puedan apoyar mejor el despliegue de la tecnología, lo cual beneficiará a las comunidades locales."]},{titleLines:["EL PROBLEMA","DEL LEGADO"],paragraphs:[`Cinco años después de tu avance regenerativo, la antigua tecnología de TechFlow sigue causando problemas. Un reportaje de investigación revela que comunidades en tres países aún lidian con daños ambientales que pueden vincularse directa e indirectamente a los sistemas pre-regenerativos de TechFlow. La periodista y activista María Santos te confronta: "Ustedes han pasado a la tecnología limpia, pero ¿qué hay del desastre que dejaron atrás? ¿Acaso su empresa no usó a la gente para desarrollarse y ser visto como el 'Buen Samaritano'?" La junta directiva de TechFlow - que ya cuenta con una buena representación de comunidades con las que trabajan - está dividida sobre cómo responder. ¿Qué defiendes?`],options:["Enfocar los recursos de la empresa en prevenir daños futuros en lugar de abordar estos problemas pasados.","Asumir responsabilidad directa por la regeneración integral de la naturaleza y las comunidades dañadas por operaciones pasadas, siendo transparente sobre cómo evitar daños futuros.","Proporcionar apoyo financiero significativo a los esfuerzos de limpieza liderados por el gobierno en todas las regiones afectadas.","Reconocer públicamente los daños pasados y documentarlos con transparencia en todas las comunicaciones de la empresa.","Implementar políticas nuevas y estrictas para garantizar que los despliegues futuros de tecnología nunca causen impactos ambientales o sanitarios similares en ninguna parte del mundo."]},{titleLines:["LA MÁSCARA","VERDE"],paragraphs:['Tus esfuerzos integrales de restauración reciben elogios a nivel global, pero también atraen críticas de fuentes inesperadas que creías que te apoyaban. Durante un proyecto de restauración en México, el líder indígena Carlos Mendoza desafía tu enfoque: "Todavía están haciendo esto PARA nosotros, no CON nosotros. Solo trabajan con nosotros para conocer nuestros problemas, pero ustedes siguen teniendo el control total sobre cómo es la restauración, contratan a los proveedores, definen el éxito. Este es el mismo patrón colonial con una máscara verde". Sus palabras duelen porque reconoces su verdad, pero cuesta aceptarlo dado todo el esfuerzo que has hecho a lo largo de los años para ayudarles. ¿Cómo cambias fundamentalmente el enfoque de TechFlow?'],options:["Identificar y eliminar los patrones coloniales de todas las operaciones y trabajar en un proceso para transferir poder real que apoye la soberanía y los derechos territoriales indígenas.","Incluir más voces indígenas y perspectivas diversas en los equipos de restauración y desarrollo de TechFlow.","Proporcionar capacitación y educación tecnológica integral a las comunidades indígenas y afectadas.","Establecer asociaciones formales con organizaciones y comunidades indígenas para todos los proyectos de tecnología y restauración.","Estudiar e incorporar el conocimiento y las prácticas ecológicas tradicionales en todo el diseño tecnológico y el trabajo de restauración."]},{titleLines:["La Tecnología","Viviente"],paragraphs:['El proceso de transferir poder real a las comunidades transforma tan profundamente a TechFlow que tu CEO renuncia y la junta directiva - ahora compuesta mayoritariamente por miembros de la comunidad - decide que eres la persona adecuada para el puesto. ¡Felicidades, ahora eres el CEO de TechFlow! Pero justo en tu primer mes como CEO, una noticia se propagó como un reguero de pólvora en los medios conservadores: "Tensión entre TechFlow comunista y grupos terroristas zapatistas en México en medio de conflictos por el desarrollo tecnológico". La junta está agitada, incluso los llamados socios progresistas están picando el anzuelo. Hablas con tu equipo y te explican: "Las comunidades en Chiapas han estado con nosotros desde hace tiempo, pero están amenazando con construir su propia tecnología si no encontramos la manera de dejar de marginalizar el conocimiento indígena". ¿Cómo abordas esta situación?'],options:["Implementar una política que bloquee a las comunidades bajo control de grupos paramilitares para usar la tecnología, manteniendo los sistemas actuales mientras se hace la transición a trabajar solo con comunidades no indígenas.","Evitar las noticias y centrarse en la biomímesis avanzada, creando tecnología que copie y aprenda de procesos y organismos naturales.","Defender públicamente los derechos de las comunidades indígenas alrededor del mundo mientras creas un equipo dedicado a un proceso transdisciplinario para pilotar tecnologías que funciona acorde a la relación de la comunidad con la vida.","Hacer una declaración que no aborde tu compromiso con los pueblos indígenas, pero que ataque agresivamente a los grupos violentos y prometa priorizar el diseño de todos los sistemas para que tengan el menor impacto ambiental posible.","Construir toda la tecnología solicitada exclusivamente con materiales locales, sostenibles, reciclables y renovables."]},{titleLines:["Verdades","incómodas"],paragraphs:["Trabajar con las comunidades en Chiapas crea una tecnología que realmente vive dentro de los sistemas naturales, pero también revela verdades incómodas sobre el impacto global de TechFlow. Tus cooperativas controladas por la comunidad prosperan en algunos lugares mientras luchan en otros. En Kenia, la tecnología empodera a los pequeños agricultores, pero en Bangladesh, es acaparada por terratenientes adinerados que excluyen a los agricultores más pobres. Pensaste que esto había terminado hace años, pero el problema sigue reapareciendo y la complejidad te abruma durante una noche de insomnio en tu hotel de la Ciudad de México. ¿Cómo abordas la realidad de que tu tecnología quizás siempre ayude a algunos mientras perjudica a otros?"],options:["Realizar evaluaciones de impacto integrales antes de que cada nueva cooperativa comience a operar, asegurando que todos los proyectos sigan lineamientos estrictos adaptados a cada contexto local.","Proporcionar capacitación regular a todos los miembros de las cooperativas sobre cómo identificar y abordar impactos negativos potenciales.","Establecer comités de ética y juntas de revisión con expertos globales para evaluar cómo la tecnología impacta a las comunidades.","Desarrollar lineamientos y estándares éticos integrales para seguir consistentemente mediante sistemas de incentivos y castigos.","Comprometerse a romper el mito de la neutralidad tecnológica, siendo consciente de cómo la tecnología siempre estará influenciada por el sistema socioeconómico más amplio, lo que requiere una evaluación continua de a quién ayuda y a quién daña, y cómo mejorar."]},{titleLines:["CRISIS","DEMOCRÁTICA"],paragraphs:['Tu compromiso por abordar los daños sistémicos lleva a una gran reorganización de la red global de cooperativas. Sin embargo, esto crea un nuevo desafío: la red ha crecido tanto que la toma de decisiones se está volviendo difícil. Algunas cooperativas quieren eficiencia centralizada, otras exigen autonomía local. La tensión llega a un punto crítico durante una acalorada videoconferencia con los representantes de las cooperativas. Fátima, desde Detroit, argumenta: "Necesitamos decisiones más rápidas para competir con las grandes tecnológicas". Pero James, desde Ghana, replica: "La velocidad mata la democracia". Como figura principal y arquitecto fundador de la red, todos te miran en busca de orientación. ¿Qué estructura propones?'],options:["Organizar asambleas globales periódicas donde todos los representantes puedan discutir y debatir decisiones que afecten a toda la red.","Asegurar que cada comunidad afectada mantenga un poder local real para tomar decisiones vinculantes sobre la tecnología que impacta sus vidas, independientemente de las sugerencias de los consejos consultivos globales.","Crear consejos consultivos con representantes de cada cooperativa para guiar las decisiones políticas que afecten a toda la red.","Iniciar modelos de asociación público-privada que incluyan a representantes de las cooperativas como asesores en las estructuras de gobernanza local.","Invitar a representantes comunitarios a  unirse a una junta coordinadora central con autoridad de decisión para los grandes problemas de la red global."]},{titleLines:["SOBERANÍA","DE LOS DATOS"],paragraphs:['La reestructuración democrática funciona, pero saca a la luz un problema crítico que ha estado latente todo este tiempo: la soberanía de los datos. La red de cooperativas ha acumulado grandes cantidades de datos comunitarios - patrones agrícolas, tendencias de salud, flujos económicos, relaciones sociales - ellos pueden acceder a ellos, pero todo está en los servidores de datos de TechFlow. Ahora gobiernos, investigadores y corporaciones exigen acceso. La Unión Europea ofrece un acuerdo comercial condicionado al intercambio de datos. La ONU quiere datos de salud para la preparación ante pandemias. Los gigantes tecnológicos ofrecen millones por los patrones de compra. La líder comunitaria Amara, desde Brasil, corta el ruido: "Esta es nuestra información, sobre nuestras vidas, nuestra tierra, nuestros hijos. ¡Nosotros debemos decidir qué pasa con ella!". ¿Cuál es tu posición?'],options:["Permitir que las cooperativas controlen los datos con políticas de privacidad sólidas y medidas de seguridad que protejan la información comunitaria.","Proporcionar los datos solo a gobiernos democráticos para garantizar que se utilicen para el beneficio público legítimo y la investigación científica.","Asegurar que las comunidades y los individuos mantengan control completo sobre sus propios datos, participando directamente en las discusiones y teniendo la decisión final sobre el acceso y uso de los datos.","Establecer organizaciones terceras independientes para servir como custodios neutrales de todos los datos comunitarios.","Crear cuerpos gubernamentales descentralizados que incluyan representativos de la comunidad para custodiar el uso global de los datos."]}],V_=nr.map((t,e)=>({...t,titleLines:Gu[e].titleLines,paragraphs:Gu[e].paragraphs,principle:Vu[e].principle,advisors:t.advisors.map((n,i)=>({...n,quote:Vu[e].advisors[i]})),options:t.options.map((n,i)=>({...n,text:Gu[e].options[i],explanation:Vu[e].explanations[i]}))})),o3={...Da,titleLines:["LA","VISIÓN"],advisors:Da.advisors.map((t,e)=>({...t,quote:a3[e]})),paragraphs:["Han pasado 20 años desde que entraste por primera vez a TechFlow.","Ahora, te presentas ante la asamblea más grande de cooperativas tecnológicas del mundo, representando a 10,000 comunidades globales que quieren unirse a la comunidad cooperativa de TechFlow, que ya cuenta con 8,000 comunidades en todo el mundo. Creen que TechFlow es un ejemplo de cómo la tecnología puede tomar una postura firme y radical para ayudar a las comunidades y al planeta.","Sin embargo, explican que la Crisis Climática ha creado un contexto difícil para la próxima generación de tecnología. Los niños que nacieron cuando comenzaste tu viaje son ahora jóvenes adultos que preguntan qué tipo de mundo tecnológico heredarán y cómo estas tecnologías les darán una esperanza real. Tus acciones guiarán el desarrollo de tecnología que podría llegar a mil millones de personas. Al contemplar los rostros de todos los continentes, sientes un nerviosismo que pesa como el mundo sobre tus hombros. Todos estos años han llegado a este momento, y sin embargo sientes que nunca habías trabajado en esto antes, que no tienes idea de lo que estás haciendo... que eres un completo impostor. Respiras hondo y comprendes que este es tu momento para encarnar todo lo que has aprendido sobre justicia ambiental y tecnología.","¿Qué visión ofreces para el futuro?"]},te=t=>typeof t=="string",Os=()=>{let t,e;const n=new Promise((i,r)=>{t=i,e=r});return n.resolve=t,n.reject=e,n},Yu=t=>t==null?"":String(t),l3=(t,e,n)=>{t.forEach(i=>{e[i]&&(n[i]=e[i])})},c3=/###/g,Nv=t=>t&&t.includes("###")?t.replace(c3,"."):t,Tv=t=>!t||te(t),ca=(t,e,n)=>{const i=te(e)?e.split("."):e;let r=0;for(;r<i.length-1;){if(Tv(t))return{};const s=Nv(i[r]);!t[s]&&n&&(t[s]=new n),Object.prototype.hasOwnProperty.call(t,s)?t=t[s]:t={},++r}return Tv(t)?{}:{obj:t,k:Nv(i[r])}},Av=(t,e,n)=>{const{obj:i,k:r}=ca(t,e,Object);if(i!==void 0||e.length===1){i[r]=n;return}let s=e[e.length-1],a=e.slice(0,e.length-1),l=ca(t,a,Object);for(;l.obj===void 0&&a.length;)s=`${a[a.length-1]}.${s}`,a=a.slice(0,a.length-1),l=ca(t,a,Object),l!=null&&l.obj&&typeof l.obj[`${l.k}.${s}`]<"u"&&(l.obj=void 0);l.obj[`${l.k}.${s}`]=n},u3=(t,e,n,i)=>{const{obj:r,k:s}=ca(t,e,Object);r[s]=r[s]||[],r[s].push(n)},nc=(t,e)=>{const{obj:n,k:i}=ca(t,e);if(n&&Object.prototype.hasOwnProperty.call(n,i))return n[i]},d3=(t,e,n)=>{const i=nc(t,n);return i!==void 0?i:nc(e,n)},G_=(t,e,n)=>{for(const i in e)i!=="__proto__"&&i!=="constructor"&&(Object.prototype.hasOwnProperty.call(t,i)?te(t[i])||t[i]instanceof String||te(e[i])||e[i]instanceof String?n&&(t[i]=e[i]):G_(t[i],e[i],n):t[i]=e[i]);return t},kn=t=>t.replace(/[\-\[\]\/\{\}\(\)\*\+\?\.\\\^\$\|]/g,"\\$&"),h3={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","/":"&#x2F;"},p3=t=>te(t)?t.replace(/[&<>"'\/]/g,e=>h3[e]):t;class f3{constructor(e){this.capacity=e,this.regExpMap=new Map,this.regExpQueue=[]}getRegExp(e){const n=this.regExpMap.get(e);if(n!==void 0)return n;const i=new RegExp(e);return this.regExpQueue.length===this.capacity&&this.regExpMap.delete(this.regExpQueue.shift()),this.regExpMap.set(e,i),this.regExpQueue.push(e),i} Submit:"Enviar",Send:"Enviar",Sent:"Enviado",All:"Todos","Fully aligned":"Totalmente alineada","Partially aligned":"Parcialmente alineada","Non-aligned":"No alineada","Environmental Justice in Tech":"Justicia Ambiental en la Tecnología","S.01. HOW TO PLAY":"S.01. CÓMO JUGAR","WELCOME TO":"BIENVENIDO A","The simulation":"La simulación","In this simulation, you will be faced with a series of scenarios that will put to the test your current comprehension of the impacts of technology in our society and environment.":"En esta simulación, te enfrentarás a una serie de escenarios que pondrán a prueba tu comprensión actual de los impactos de la tecnología en nuestra sociedad y nuestro medio ambiente.","The journey":"El viaje","We will take you on a journey that starts with you as an intern in a tech startup and ends 20 years later with you in positions of power. And as time passes and you gain more power, the scenarios will become more complicated.":"Te llevaremos en un viaje que comienza contigo siendo pasante en una startup tecnológica, y termina 20 años después, tras los cuales te encuentras en una posición de poder. A medida que pase el tiempo y subas de puesto, los escenarios se volverán cada vez más complicados.","The clock":"El reloj","In this world everything moves fast, leaving many things broken. Here, you will also be faced with this time pressure and you will have 1.5min to choose an answer.":"En este mundo todo se mueve rápido, dejando muchas cosas rotas. Aquí también enfrentarás esta presión de tiempo y tendrás 1.5 min para elegir una respuesta.","Your advisors":"Tus asesores","Finally, if you are in doubt you can call one of your advisors. But keep in mind that everyone has a unique bias. So, stay critical.":"Finalmente, si tienes dudas puedes llamar a uno de los asesores. Sin embargo, debes tomar en cuenta que cada uno cuenta con algún sesgo, por lo que debes mantener una perspectiva crítica.","S.02. YOUR GOAL":"S.02. TU META",YOUR:"TU",GOAL:"META","The simulation is based on a series of Environmental Justice in Technology principles that will be revealed to you once you complete all the scenarios. You may or may not agree with them, and so we ask you to keep a critical perspective on this matter as well.":"La simulación se basa en una serie de principios de Justicia Ambiental en la Tecnología que se te revelarán cuando completes todos los escenarios. Puede que estés de acuerdo con ellos o no, por lo que te pedimos que también mantengas una perspectiva crítica al respecto.","Your goal is simple, you will be asked to selected one of five options that is most aligned with what you believe to be Environmental Justice in Technology.":"Tu meta es simple: se te pedirá que selecciones una de cinco opciones, la que esté más alineada con lo que crees que es la Justicia Ambiental en la Tecnología.","Simple like that.":"Así de simple.","S.01. WELCOME TO STUDY MODE":"S.01. BIENVENIDO AL MODO ESTUDIO","STUDY MODE":"MODO ESTUDIO","Why you are here":"Por qué estás aquí","If you are here, it means you already had a first experience with the simulation mode and you were able to reflect a little about Environmental Justice in Technology.":"Si estás aquí, significa que ya tuviste una primera experiencia con el modo simulación y pudiste reflexionar un poco sobre la Justicia Ambiental en la Tecnología.","No time pressure":"Sin presión de tiempo","In this mode you will have no time pressure, leaving you with the opportunity to contemplate and further reflect on the scenarios you encountered in the simulation mode. More specifically, here you will be able to:":"En este modo no tendrás presión de tiempo, lo que te da la oportunidad de contemplar y reflexionar más a fondo sobre los escenarios que encontraste en el modo simulación. Más específicamente, aquí podrás:","• See the EJIT Principle is aligned to each answer.":"• Ver con qué Principio de EJIT se alinea cada respuesta.","• See how each answer aligns to the principle.":"• Ver cómo se alinea cada respuesta con el principio.","• See the suggestions and biases of all advisors for each scenario.":"• Ver las sugerencias y los sesgos de todos los asesores en cada escenario.","• See a reasoning behind the answer alignment.":"• Ver el razonamiento detrás de la alineación de cada respuesta.","• Access additional learning resources associated to each scenario.":"• Acceder a recursos de aprendizaje adicionales asociados a cada escenario.","• Provide feedback to us on corrections or ideas for improvement of each scenario.":"• Enviarnos comentarios con correcciones o ideas para mejorar cada escenario.","S.02. A FINAL GIFT":"S.02. UN REGALO FINAL","A FINAL":"UN REGALO",GIFT:"FINAL","Finally, after you are done you will be able to download the cards and a facilitators guide, as well as apply to be part of our Study Hall Facilitators’ Program!":"Por último, cuando termines podrás descargar las tarjetas y una guía para facilitadores, ¡y también postularte para ser parte de nuestro Programa de Facilitadores de Study Hall!","We wish you a great learning experience!":"¡Te deseamos una gran experiencia de aprendizaje!","S.03. CONSENT & TRANSPARENCY":"S.03. CONSENTIMIENTO Y TRANSPARENCIA","CONSENT &":"CONSENTIMIENTO Y",TRANSPARENCY:"TRANSPARENCIA","During this experience, we collect the following data with the goal of providing you with the results of the simulation and of making this and future EJIT learning experiences better:":"Durante esta experiencia, recopilamos los siguientes datos con el objetivo de darte los resultados de la simulación y de mejorar esta y futuras experiencias de aprendizaje de EJIT:","Country (to display local definitions of EJIT)":"País (para mostrar definiciones locales de EJIT)","Answers to each question (for scoring)":"Respuestas a cada pregunta (para calcular el puntaje)","Features used during the game (i.e., advisors' call)":"Funciones utilizadas durante el juego (p. ej., llamadas a asesores)","Time spent reading and answering each scenario (to improve readability, accessibility, and difficulty)":"Tiempo dedicado a leer y responder cada escenario (para mejorar la legibilidad, la accesibilidad y la dificultad)","Additional telemetry on clicks and devices used (to improve overall design and accessibility to more than one type of device and OS).":"Telemetría adicional sobre clics y dispositivos utilizados (para mejorar el diseño general y la accesibilidad en más de un tipo de dispositivo y sistema operativo).","We DO NOT collect and/or store:":"NO recopilamos ni almacenamos:","Any personal or contact information (e.g., email, specific address beyond country)":"Ninguna información personal o de contacto (p. ej., correo electrónico, dirección específica más allá del país)","During this part of the experience, we collect the following data with the goal of making this and future EJIT learning experiences better:":"Durante esta parte de la experiencia, recopilamos los siguientes datos con el objetivo de mejorar esta y futuras experiencias de aprendizaje de EJIT:","Country (to cross with provided suggestions)":"País (para cruzarlo con las sugerencias recibidas)","Suggestions on each scenario (ie. disagree section)":"Sugerencias sobre cada escenario (p. ej., la sección de desacuerdo)","Total time spent in each scenario (to explore complexity and difficulty in each scenario)":"Tiempo total dedicado a cada escenario (para explorar la complejidad y la dificultad de cada escenario)","Additional telemetry on clicks in buttons during and at the end of the game (e.g., learn beyond button, download of facilitators’ guide and cards, apply to facilitators’ program, etc).":"Telemetría adicional sobre clics en botones durante y al final del juego (p. ej., el botón de saber más, la descarga de la guía para facilitadores y las tarjetas, la postulación al programa de facilitadores, etc.).","S.04. GOALS":"S.04. METAS","But before we start...what is Environmental Justice in Technology for you?":"Pero antes de empezar... ¿qué es para ti la Justicia Ambiental en la Tecnología?",wordsSelected_one:"{{count}} palabra seleccionada.",wordsSelected_other:"{{count}} palabras seleccionadas.",selectedLetter:"Seleccionada {{letter}}",submitLetter:"Enviar {{letter}}",scenarioTitle:"Escenario {{n}}: {{title}}",scenarioN:"Escenario {{n}}",scoreRange:"{{name}} {{from}} a {{to}}",everyone:"Todas las personas: {{avg}}/{{max}}",wordCloudLabel:"Nube de palabras de lo que eligieron las personas jugadoras, para {{scope}}",shareSubject:"{{game}} — Obtuve: {{label}}",playLink:"Juega: {{url}}","Pick as many words as you like.":"Elige todas las palabras que quieras.","Words you would choose":"Palabras que elegirías","Let’s start?":"¿Empezamos?","YES!":"¡SÍ!","NO. I want to review the rules and goals again.":"NO. Quiero revisar las reglas y las metas otra vez.",Equity:"Equidad",Access:"Acceso",Sustainability:"Sostenibilidad",Impact:"Impacto",Justice:"Justicia",Waste:"Desechos",Communities:"Comunidades",Pollution:"Contaminación","E-waste":"Residuos electrónicos","Digital divide":"Brecha digital",Inclusion:"Inclusión",Accountability:"Rendición de cuentas",Extraction:"Extracción",Power:"Poder",Resources:"Recursos",Representation:"Representación",Transparency:"Transparencia",Harm:"Daño",Solutions:"Soluciones",Marginalized:"Marginación",Responsibility:"Responsabilidad",Climate:"Clima",Labor:"Trabajo",Data:"Datos",Participation:"Participación",Rights:"Derechos","Supply chain":"Cadena de suministro",Toxicity:"Toxicidad",Health:"Salud",Sovereignty:"Soberanía","Select Answer":"Elegir respuesta","STUDY HALL BY ROOTED FUTURES LAB":"STUDY HALL POR ROOTED FUTURES LAB","Answer Question":"Responder pregunta","The clock starts when you do":"El reloj empieza cuando tú empiezas",Select:"Seleccionar","Next Question":"Siguiente pregunta","When you don’t decide, someone will decide for you.":"Cuando tú no decides, alguien más decidirá por ti.","Selected in simulation mode":"Elegida en el modo simulación","TIMES UP!":"¡SE ACABÓ EL TI
